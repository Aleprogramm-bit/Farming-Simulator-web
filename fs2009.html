<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Farming Simulator 2009</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0b0b0b;
      --neon-green: #39ff14;
      --text-main: #e5e5e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #0f0f0f 0, #000 40%, #020202 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
    }

    .card {
      background: linear-gradient(145deg, #050505, #101010);
      border-radius: 14px;
      border: 1px solid rgba(57,255,20,0.5);
      box-shadow: 0 0 14px rgba(57,255,20,0.4);
      max-width: 700px;
      width: 100%;
      padding: 16px 18px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--neon-green);
      text-shadow: 0 0 8px rgba(57,255,20,0.9);
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 14px;
    }

    .field {
      background: rgba(10,10,10,0.9);
      border-radius: 10px;
      border: 1px solid rgba(57,255,20,0.35);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #8cff7a;
    }

    .field-value { font-size: 0.9rem; }

    .screenshots { max-width: 900px; width: 100%; margin-top: 24px; }

    .section-title {
      font-size: 1.2rem;
      text-transform: uppercase;
      color: var(--neon-green);
      text-shadow: 0 0 8px rgba(57,255,20,0.9);
      margin-bottom: 14px;
      text-align: center;
    }

    .grid-screens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .shot {
      background: linear-gradient(145deg, #050505, #101010);
      border: 1px solid rgba(57,255,20,0.4);
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(57,255,20,0.3);
      overflow: hidden;
    }

    .shot-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }

    .shot-label {
      text-align: center;
      padding: 8px 0;
      color: var(--neon-green);
    }
  </style>
</head>
<body>

  <article class="card">
    <div class="card-title">Farming Simulator 2009</div>

    <div class="grid">
      <div class="field">
        <div class="field-label">Nome</div>
        <div class="field-value">Landwirtschafts-Simulator 2009</div>
      </div>

      <div class="field">
        <div class="field-label">Lingue</div>
        <div class="field-value">Tedesco, Inglese</div>
      </div>

      <div class="field">
        <div class="field-label">Anno</div>
        <div class="field-value">2009</div>
      </div>

      <div class="field">
        <div class="field-label">Colture</div>
        <div class="field-value">Grano, Orzo, Mais, Colza, Erba</div>
      </div>

      <div class="field">
        <div class="field-label">Marchi</div>
        <div class="field-value">Fendt, Pottinger, Horsh, (Lizard)</div>
      </div>

      <div class="field">
        <div class="field-label">Mappe</div>
        <div class="field-value">Giants Island 2009</div>
      </div>

      <div class="field">
        <div class="field-label">Animali</div>
        <div class="field-value">Nessuno</div>
      </div>

      <div class="field">
        <div class="field-label">Espansioni</div>
        <div class="field-value">Gold Edition</div>
      </div>
    </div>
  </article>

  <section class="screenshots">
    <h2 class="section-title">Screenshot</h2>
    <div class="grid-screens">
      <div class="shot">
        <img src="img/ad.jpg" class="shot-img" />
        <div class="shot-label">Screenshot D</div>
      </div>
      <div class="shot">
        <img src="img/ae.jpg" class="shot-img" />
        <div class="shot-label">Screenshot E</div>
      </div>
      <div class="shot">
        <img src="img/af.jpg" class="shot-img" />
        <div class="shot-label">Screenshot F</div>
      </div>
    </div>
  </section>

</body>
</html>
