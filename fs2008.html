<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Scheda Farming Simulator 2008</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0b0b0b;
      --neon-green: #39ff14;
      --text-main: #e5e5e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f0f0f 0, #000000 40%, #020202 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      gap: 32px;
    }

    .card {
      background: linear-gradient(145deg, #050505, #101010);
      border-radius: 14px;
      border: 1px solid rgba(57, 255, 20, 0.5);
      box-shadow:
        0 0 14px rgba(57, 255, 20, 0.4),
        0 0 3px rgba(0, 0, 0, 0.9);
      max-width: 700px;
      width: 100%;
      padding: 16px 18px 18px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--neon-green);
      text-shadow: 0 0 8px rgba(57, 255, 20, 0.9);
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 14px;
    }

    .field {
      background: rgba(10, 10, 10, 0.9);
      border-radius: 10px;
      border: 1px solid rgba(57, 255, 20, 0.35);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #8cff7a;
    }

    .field-value {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    /* Screenshot section */
    .screenshots {
      max-width: 900px;
      width: 100%;
    }

    .section-title {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #39ff14;
      text-shadow: 0 0 8px rgba(57, 255, 20, 0.9);
      margin-bottom: 14px;
      text-align: center;
    }

    .grid-screens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .shot {
      background: linear-gradient(145deg, #050505, #101010);
      border: 1px solid rgba(57, 255, 20, 0.4);
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .shot:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.5);
    }

    .shot-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .shot-label {
      text-align: center;
      padding: 8px 0;
      font-size: 0.9rem;
      color: #39ff14;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.7);
    }
  </style>
</head>
<body>

  <article class="card">
    <div class="card-title">Farming Simulator 2008</div>

    <div class="grid">
      <div class="field">
        <div class="field-label">Nome</div>
        <div class="field-value">Landwirtschafts-Simulator 2008</div>
      </div>

      <div class="field">
        <div class="field-label">Lingue</div>
        <div class="field-value">Tedesco</div>
      </div>

      <div class="field">
        <div class="field-label">Anno</div>
        <div class="field-value">2008</div>
      </div>

      <div class="field">
        <div class="field-label">Colture</div>
        <div class="field-value">Grano, Erba (mod: Grass mod)</div>
      </div>

      <div class="field">
        <div class="field-label">Marchi</div>
        <div class="field-value">Fendt, Pottinger</div>
      </div>

      <div class="field">
        <div class="field-label">Mappe</div>
        <div class="field-value">Giants Island</div>
      </div>

      <div class="field">
        <div class="field-label">Animali</div>
        <div class="field-value">Nessuno</div>
      </div>

      <div class="field">
        <div class="field-label">Espansioni</div>
        <div class="field-value">Nessuna</div>
      </div>
    </div>

    <div class="field">
        <div class="field-label">Dispositivi</div>
        <div class="field-value">PC</div>
      </div>
  </article>

  <section class="screenshots">
    <h2 class="section-title">Screenshot</h2>
    <div class="grid-screens">
      <div class="shot">
        <img src="img/aa.jpg" alt="Screenshot A" class="shot-img" />
        <div class="shot-label">Screenshot A</div>
      </div>
      <div class="shot">
        <img src="img/ab.jpg" alt="Screenshot B" class="shot-img" />
        <div class="shot-label">Screenshot B</div>
      </div>
      <div class="shot">
        <img src="img/ac.jpg" alt="Screenshot C" class="shot-img" />
        <div class="shot-label">Screenshot C</div>
      </div>
    </div>
  </section>

  <!-- Il pulsante HTML -->
<a href="https://aleprogramm-bit.github.io/Farming-Simulator-web/" class="btn-home">
  🏠 Vai alla home
</a>

<!-- Lo stile CSS (da mettere dentro il tag <style> o nel tuo file .css) -->
<style>
  .btn-home {
    display: inline-block;
    padding: 10px 20px;
    color: #000; /* Testo nero per contrastare con il neon */
    text-decoration: none;
    font-weight: bold;
    font-family: sans-serif;
    background-color: #39FF14; /* Verde Neon */
    border: 2px solid #39FF14;
    border-radius: 8px;
    box-shadow: 0 0 10px #39FF14, 0 0 20px #39FF14; /* Effetto bagliore neon */
    transition: 0.3s;
    cursor: pointer;
  }

  .btn-home:hover {
    background-color: #fff; /* Diventa bianco quando ci passi sopra */
    border-color: #39FF14;
    box-shadow: 0 0 20px #39FF14, 0 0 40px #39FF14;
    transform: scale(1.05); /* Si ingrandisce leggermente */
  }
</style>

</body>
</html>
